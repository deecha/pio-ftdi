# OpenOCD config for bring-up. Use this BEFORE trying Efinity: you can read
# OpenOCD's source when something goes wrong, and you can't read Efinity's.
#
#   openocd -f test/zen-jtag.cfg
#
# Success looks like an IDCODE line for the Trion. Anything else -- especially
# "JTAG scan chain interrogation failed" with a garbage IDCODE -- points at the
# status-byte offsets (see README, "packet size").

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0

# ADBUS: 0=TCK 1=TDI 2=TDO 3=TMS, all outputs except TDO
ftdi layout_init 0x0008 0x000b

transport select jtag
adapter speed 1000

# Trion T8 / T20 IDCODEs vary by device and package -- run with
# `-c "scan_chain"` first and use -ignore-version if the revision differs.
jtag newtap trion tap -irlen 4 -expected-id 0

init
scan_chain
shutdown
